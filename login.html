<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "base.html" %}

{% block title %}
HealthAI - Login
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🩺
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Login to continue to HealthAI
        </p>


        <form method="POST"
              action="{{ url_for('login') }}">


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit"
                    class="btn login-btn">

                Login

            </button>

        </form>


        <div class="auth-footer">

            <p>
                Don't have an account?
                
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
</body>
</html>
